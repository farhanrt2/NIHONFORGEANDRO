[package]
name = "nihonforge-mobile"
version = "1.0.0"
description = "NihonForge Mobile - latihan kotoba & kanji di HP"
authors = ["farhanrt2"]
edition = "2021"

[lib]
name = "nihonforge_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-http = "2"
urlencoding = "2.1.3"
