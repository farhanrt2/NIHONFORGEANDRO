name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Install frontend deps
        run: npm ci

      - name: Build APK (debug, arm64)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: npm run tauri android build -- --debug --target aarch64 --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nihonforge-mobile-debug-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
