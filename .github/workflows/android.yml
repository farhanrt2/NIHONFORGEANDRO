name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Runner default ke Node 24; izinkan actions lama yang masih jalan di Node 20
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # setup-android@v3 gagal: ia menjalankan `sdkmanager tools` yang sudah tidak
      # ada di repo SDK modern. Runner ubuntu sudah bawa SDK preinstalled, jadi
      # install paket yang dibutuhkan langsung.
      - name: Setup Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk/25.2.9519653/source.properties"
          ls "$ANDROID_HOME/ndk/25.2.9519653" | head -20

      - name: Install frontend deps
        run: npm ci

      - name: Build APK (debug, arm64)
        run: npm run tauri android build -- --debug --target aarch64 --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nihonforge-mobile-debug-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
